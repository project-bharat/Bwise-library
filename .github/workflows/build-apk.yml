name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: bwise-library-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
      VITE_GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      - name: Run focused tests
        run: npm test

      - name: Install Pillow
        run: pip install pillow

      - name: Generate in-app brand icon from ic_launcher_* source PNGs
        run: python scripts/generate-icons.py --brand

      - name: Build web assets
        run: npm run build

      - name: Generate Android project (not committed to git)
        run: |
          npx cap add android
          npx cap sync android

      - name: Launcher icons + manifest + version
        run: |
          python scripts/generate-icons.py --android
          python scripts/android-post-setup.py ${{ github.run_number }} "1.0.${{ github.run_number }}"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK and create ZIP with app title and build number
        run: |
          BUILD_NUMBER="${{ github.run_number }}"
          APP_TITLE="B-wise Library"
          APK_NAME="${APP_TITLE} - Build ${BUILD_NUMBER} - Debug APK.apk"
          ZIP_NAME="${APP_TITLE} - Build ${BUILD_NUMBER}.zip"
          cp android/app/build/outputs/apk/debug/app-debug.apk "${APK_NAME}"
          zip -j "${ZIP_NAME}" "${APK_NAME}"

      - name: Upload named APK
        uses: actions/upload-artifact@v4
        with:
          name: B-wise Library - Build ${{ github.run_number }} - Debug APK
          path: B-wise Library - Build ${{ github.run_number }} - Debug APK.apk
          if-no-files-found: error

      - name: Upload named ZIP
        uses: actions/upload-artifact@v4
        with:
          name: B-wise Library - Build ${{ github.run_number }} - ZIP
          path: B-wise Library - Build ${{ github.run_number }}.zip
          if-no-files-found: error
